# config/apriltag.yaml — params for the apriltag_ros (ROS 2) detector node.
# Frame names "<family>:<id>" must match CUBE_TAG_FRAMES in mile_franka/pose/apriltag.py.
apriltag:
  ros__parameters:
    family: 36h11
    size: 0.043            # measured black-border edge of the mounted tag (m)
    max_hamming: 1         # allow 1-bit error correction (safe for 36h11's large Hamming distance)
    detector:
      threads: 2
      decimate: 1.0        # 1.0 = no downsampling. 2.0 halved the ~33px tag to ~16px (undetectable);
                           # the 4.3cm tags need full resolution to clear ~5-6 px/cell decode threshold.
    tag:
      ids: [0, 1]
      frames: ["tag36h11:0", "tag36h11:1"]
